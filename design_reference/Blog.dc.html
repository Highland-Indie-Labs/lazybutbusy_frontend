<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/fonts.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/colors.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/typography.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/spacing.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/effects.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/tokens/base.css">
<link rel="stylesheet" href="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/styles.css">
<script src="_ds/lazy-but-busy-design-system-732be8d9-06f1-4bed-98a4-5d960cf71624/_ds_bundle.js"></script>
<style>html,body{margin:0;padding:0;background:#fbf9f8;} a{color:#000;} a:hover{color:#4c4546;}</style>
</helmet>
<div style="min-height:100vh;background:var(--paper);display:flex;flex-direction:column;" data-screen-label="Blog">
  <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.TopNavBar" links="{{ navLinks }}" active="Blog" cta="Hire Us (Maybe)" logo-src="assets/logo-sloth-small.jpg" on-navigate="{{ nav }}" on-cta="{{ goHire }}" hint-size="100%,72px"></x-import>
  <section style="border-bottom:2px solid var(--ink);background-image:linear-gradient(rgba(0,0,0,0.025) 2px, transparent 2px),linear-gradient(90deg, rgba(0,0,0,0.025) 2px, transparent 2px);background-size:40px 40px;">
    <div style="max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-direction:column;gap:24px;align-items:flex-start;">
      <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.SectionHeading" level="label" hint-size="auto,40px">THE BLOG</x-import>
      <h1 style="margin:0;font:var(--type-display-lg);letter-spacing:var(--ls-display-lg);text-transform:uppercase;color:var(--ink);white-space:pre-line;">Words, published
occasionally.</h1>
      <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.Chip" variant="status" hint-size="auto,32px">EDITORIAL CALENDAR: VIBES-BASED</x-import>
    </div>
  </section>
  <section>
    <div style="max-width:1200px;margin:0 auto;padding:80px 32px;display:flex;flex-direction:column;gap:24px;">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="5">
        <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.Card" surface="paper" padding="{{ 32 }}" interactive="{{ true }}" hint-size="100%,160px">
          <div style="display:grid;grid-template-columns:160px 1fr auto;gap:32px;align-items:center;">
            <div style="display:flex;flex-direction:column;gap:8px;">
              <span style="font:500 12px/16px var(--font-mono);text-transform:uppercase;color:var(--text-ghost);">{{ p.date }}</span>
              <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.Chip" variant="tag" hint-size="auto,24px">{{ p.tag }}</x-import>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <h2 style="margin:0;font:700 28px/36px var(--font-display);letter-spacing:-1.12px;color:var(--ink);">{{ p.title }}</h2>
              <p style="margin:0;font:var(--type-body-md);color:var(--text-body);">{{ p.excerpt }}</p>
            </div>
            <span style="font:500 12px/16px var(--font-mono);text-transform:uppercase;color:var(--text-muted);white-space:nowrap;">{{ p.read }}</span>
          </div>
        </x-import>
      </sc-for>
      <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.Card" dashed="{{ true }}" padding="{{ 32 }}" hint-size="100%,120px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <span style="font:500 12px/16px var(--font-mono);text-transform:uppercase;color:var(--outline);">PLACEHOLDER TITLES</span>
            <p style="margin:0;font:var(--type-body-md);color:var(--text-muted);">Real post titles arriving whenever you send them. The layout will wait. It's good at waiting.</p>
          </div>
          <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.LazyLoader" label="AWAITING CONTENT... (NO RUSH)" hint-size="280px,32px" style="width:280px;"></x-import>
        </div>
      </x-import>
    </div>
  </section>
  <x-import component-from-global-scope="LazyButBusyDesignSystem_732be8.Footer" variant="dark" hint-size="100%,160px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      navLinks: ['Tools', 'Manifesto', 'The Lab', 'Pricing', 'About', 'Blog'],
      nav: (l) => { const m = { Home: 'Home.dc.html', Tools: 'Tools.dc.html', Manifesto: 'Manifesto.dc.html', 'The Lab': 'TheLab.dc.html', Pricing: 'Pricing.dc.html', About: 'About.dc.html', Blog: 'Blog.dc.html' }; window.location.href = m[l] || 'Home.dc.html'; },
      goHire: () => { window.location.href = 'HireUs.dc.html'; },
      posts: [
        { date: '2026-08-12', tag: 'ENGINEERING', title: 'Placeholder Title #1', excerpt: 'A future post about something we automated. Excerpt pending, like everything else here.', read: '6 MIN (ALLEGEDLY)' },
        { date: '2026-07-30', tag: 'PHILOSOPHY', title: 'Placeholder Title #2', excerpt: 'A future post defending naps with citations. The citations are also napping.', read: '4 MIN' },
        { date: '2026-07-02', tag: 'CASE STUDY', title: 'Placeholder Title #3', excerpt: 'A future post about a client project. Names redacted, hours saved bragged about.', read: '8 MIN' },
        { date: '2026-06-15', tag: 'LAB NOTES', title: 'Placeholder Title #4', excerpt: 'A future post from The Lab. Survivors will be interviewed.', read: '3 MIN' },
      ],
    };
  }
}
</script>
</body>
</html>
